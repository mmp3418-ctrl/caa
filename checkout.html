<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPO BRAND | Checkout</title>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #f5f5f5;
            --border: 2px solid #000;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --whatsapp: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
/* الشعار */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo-img {
    height: 45px;
    width: auto;
    display: block;
}

.logo-text {
    font-size: 1.5rem;
    font-weight: 900;
    color: #000;
    text-transform: uppercase;
    letter-spacing: -1px;
}

.logo-text span {
    background: #000;
    color: #fff;
    padding: 0 5px;
}

@media (max-width: 768px) {
    .logo-img {
        height: 35px;
    }
    .logo-text {
        font-size: 1.2rem;
    }
}
        /* Preloader */
.preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: preloaderOut 0.5s ease 1s forwards;
}

@keyframes preloaderOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

.preloader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.preloader-logo-img {
    width: 120px;
    height: auto;
    animation: float 2s ease-in-out infinite;
}

.preloader-logo-text {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
    animation: float 2s ease-in-out infinite;
    letter-spacing: -2px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}
        .checkout-container {
            border: var(--border);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            background: var(--white);
            box-shadow: 10px 10px 0 var(--black);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: var(--border);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--black);
            text-decoration: none;
            letter-spacing: -2px;
        }

        .logo span {
            background: var(--black);
            color: var(--white);
            padding: 0 0.5rem;
        }

        .checkout-title {
            font-size: 1.5rem;
            margin-top: 1rem;
            text-transform: uppercase;
        }

        .order-summary {
            border: var(--border);
            padding: 1rem;
            margin-bottom: 2rem;
            background: var(--gray);
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #ccc;
            font-size: 0.9rem;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            font-size: 1.3rem;
            padding-top: 1rem;
            border-top: var(--border);
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: var(--border);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            background: var(--gray);
        }

        .whatsapp-btn {
            background: var(--black);
            color: var(--white);
            border: var(--border);
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-transform: uppercase;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .whatsapp-btn:hover {
            background: var(--whatsapp);
            transform: translate(-3px, -3px);
            box-shadow: 3px 3px 0 var(--black);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        .back-link:hover { opacity: 0.6; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .checkout-container { padding: 1rem; }
            .checkout-container { box-shadow: 5px 5px 0 var(--black); }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
<div class="preloader">
    <div class="preloader-content">
        <img src="lo2.PNG" alt="CAPO" class="preloader-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <div class="preloader-logo-text" style="display: none;">CAPO</div>
    </div>
</div>
    </div>

    <div class="checkout-container">
        <div class="checkout-header">
           <a href="index.html" class="logo">
    <img src="lo.jpg" alt="CAPO Logo" class="logo-img" onerror="this.style.display='none'">
    <span class="logo-text">CAPO<span>BRAND</span></span>
</a>
            <h1 class="checkout-title">Checkout</h1>
        </div>

        <div class="order-summary" id="orderSummary"></div>

        <form id="checkoutForm">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name *</label>
                <input type="text" id="fullName" class="form-input" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">Phone Number *</label>
                <input type="tel" id="phone" class="form-input" required placeholder="09XXXXXXXX">
            </div>

            <div class="form-group">
                <label class="form-label" for="address">Address *</label>
                <input type="text" id="address" class="form-input" required placeholder="City, Street, Details">
            </div>

            <button type="submit" class="whatsapp-btn">
                💬 Send via WhatsApp
            </button>
        </form>

        <a href="cart.html" class="back-link">← Back to Cart</a>
    </div>

    <script>
        const WHATSAPP_NUMBER = "218910000000"; // ضع رقم الواتساب هنا

        function displayOrderSummary() {
            const cart = JSON.parse(localStorage.getItem('capo_cart')) || [];
            const summaryContainer = document.getElementById('orderSummary');
            
            if (cart.length === 0) {
                summaryContainer.innerHTML = '<p style="text-align: center;">Cart is empty</p>';
                return 0;
            }
            
            let total = 0;
            
            const itemsHTML = cart.map(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="order-item">
                        <span>${item.name} (${item.size}) × ${item.qty}</span>
                        <span>${itemTotal} LYD</span>
                    </div>
                `;
            }).join('');
            
            summaryContainer.innerHTML = `
                ${itemsHTML}
                <div class="order-total">
                    <span>Total:</span>
                    <span>${total} LYD</span>
                </div>
            `;
            
            return total;
        }

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            
            const cart = JSON.parse(localStorage.getItem('capo_cart')) || [];
            const total = displayOrderSummary();
            
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            
            let message = `🛍️ *CAPO BRAND - New Order*\n\n`;
            message += `👤 *Name:* ${fullName}\n`;
            message += `📱 *Phone:* ${phone}\n`;
            message += `📍 *Address:* ${address}\n\n`;
            message += `📦 *Order Details:*\n`;
            
            cart.forEach(item => {
                message += `• ${item.name} (${item.size}) × ${item.qty} = ${item.price * item.qty} LYD\n`;
            });
            
            message += `\n💰 *Total: ${total} LYD*`;
            
            const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
            
            localStorage.removeItem('capo_cart');
            
            alert('Order sent successfully!');
            window.location.href = 'index.html';
        });

        displayOrderSummary();
    </script>
</body>
</html>
