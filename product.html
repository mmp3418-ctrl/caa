<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPO BRAND | Product</title>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #f5f5f5;
            --border: 2px solid #000;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
        }

        a, button, div, img {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* الشعار */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo-text span {
            background: #000;
            color: #fff;
            padding: 0 5px;
        }

        /* Preloader */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: preloaderOut 0.5s ease 1s forwards;
        }

        @keyframes preloaderOut {
            to { opacity: 0; visibility: hidden; }
        }

        .preloader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .preloader-logo-img {
            width: 120px;
            height: auto;
            animation: float 2s ease-in-out infinite;
        }

        .preloader-logo-text {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            animation: float 2s ease-in-out infinite;
            letter-spacing: -2px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav a {
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: var(--transition);
            position: relative;
            padding: 0.5rem 0;
            letter-spacing: 0.5px;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 3px;
            background: var(--black);
            transition: var(--transition);
        }

        .nav a:hover::after {
            width: 100%;
        }

        .cart-badge {
            background: var(--black);
            color: var(--white);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            margin-right: 0.3rem;
        }

        .menu-toggle {
            display: none;
            background: var(--white);
            border: var(--border);
            padding: 0.5rem 0.8rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--black);
            font-family: inherit;
            font-weight: bold;
        }

        .mobile-menu {
            display: none;
            background: var(--white);
            border-bottom: var(--border);
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            z-index: 99;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 1rem 1.5rem;
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            font-size: 1rem;
            transition: var(--transition);
        }

        .mobile-menu a:hover {
            background: var(--black);
            color: var(--white);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .product-image-large {
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            background: var(--gray);
            position: relative;
            overflow: hidden;
        }

        .product-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .product-image-placeholder {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
        }

        .product-details {
            padding: 1rem;
        }

        .product-number-large {
            display: inline-block;
            background: var(--black);
            color: var(--white);
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }

        .product-price-large {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        /* زر نسخ الرابط */
        .copy-link-btn {
            display: inline-block;
            background: var(--white);
            color: var(--black);
            border: var(--border);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            transition: var(--transition);
            text-transform: uppercase;
        }

        .copy-link-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .copy-link-btn:active {
            transform: scale(0.95);
        }

        .size-section {
            margin-bottom: 1.5rem;
        }

        .size-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .size-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .size-btn {
            width: 45px;
            height: 45px;
            border: var(--border);
            background: var(--white);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .size-btn:hover,
        .size-btn.selected {
            background: var(--black);
            color: var(--white);
        }

        .qty-section {
            margin-bottom: 1.5rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .qty-btn {
            width: 45px;
            height: 45px;
            border: var(--border);
            background: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .qty-display {
            font-size: 1.3rem;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        /* أزرار الإجراء */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .add-to-cart-btn,
        .order-now-btn {
            flex: 1;
            padding: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: var(--transition);
            border: var(--border);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .add-to-cart-btn {
            background: var(--black);
            color: var(--white);
        }

        .add-to-cart-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        .order-now-btn {
            background: var(--white);
            color: var(--black);
        }

        .order-now-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .order-now-btn:active {
            transform: scale(0.95);
        }

        .success-message {
            display: none;
            background: var(--black);
            color: var(--white);
            padding: 1rem;
            text-align: center;
            margin-top: 1rem;
            font-weight: bold;
            border: var(--border);
        }

        /* إشعار */
        .cart-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--black);
            color: var(--white);
            padding: 1rem 1.5rem;
            border: var(--border);
            z-index: 9999;
            font-weight: bold;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideInRight 0.3s ease;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .nav { display: none; }
            .menu-toggle { display: block; }
            .logo-img { height: 35px; }
            .logo-text { font-size: 1.2rem; }
            .product-detail { grid-template-columns: 1fr; gap: 1rem; }
            .product-image-large { min-height: 300px; }
            .product-details { padding: 0.5rem; }
            .product-title { font-size: 1.5rem; }
            .product-price-large { font-size: 2rem; }
            .size-btn { width: 40px; height: 40px; font-size: 0.8rem; }
            .qty-btn { width: 40px; height: 40px; }
            .action-buttons { flex-direction: column; gap: 0.5rem; }
            .add-to-cart-btn, .order-now-btn { padding: 0.8rem; font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .product-image-large { min-height: 250px; }
            .product-title { font-size: 1.3rem; }
            .product-price-large { font-size: 1.8rem; }
            .size-options { gap: 0.3rem; }
            .size-btn { width: 35px; height: 35px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="preloader-content">
            <img src="lo2.png" alt="CAPO" class="preloader-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <div class="preloader-logo-text" style="display: none;">CAPO</div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <img src="lo.jpg" alt="CAPO Logo" class="logo-img" onerror="this.style.display='none'">
                <span class="logo-text">CAPO<span>BRAND</span></span>
            </a>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">
                    Cart
                    <span class="cart-badge" id="cartBadge">0</span>
                </a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="mobileCartBadge">0</span>)</a>
    </div>

    <!-- Product Detail -->
    <div class="container">
        <a href="shop.html" class="back-link">← Back to Shop</a>
        <div class="product-detail" id="productDetail"></div>
        <div class="success-message" id="successMessage">✓ Added to cart successfully!</div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "218920469011";
        
        const products = JSON.parse(localStorage.getItem('capo_products')) || [
            { id: 1, name: "CAPO 1", price: 150, image: "te1.jpeg" },
            { id: 2, name: "CAPO 2", price: 175, image: "te2.jpeg" },
            { id: 3, name: "CAPO 3", price: 150, image: "te3.jpeg" },
            { id: 4, name: "CAPO 4", price: 150, image: "te4.jpeg" },
            { id: 5, name: "CAPO 5", price: 150, image: "te5.jpeg" },
            { id: 6, name: "CAPO 6", price: 150, image: "te6.jpeg" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));
        const product = products.find(p => p.id === productId);
        
        let selectedSize = 'M';
        let selectedQty = 1;

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('capo_cart')) || [];
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').textContent = count;
            document.getElementById('mobileCartBadge').textContent = count;
        }

        function displayProduct() {
            const container = document.getElementById('productDetail');
            
            if (!product) {
                container.innerHTML = '<h2>Product not found</h2>';
                return;
            }
            
            const sizes = ['S', 'M', 'L', 'XL', 'XXL'];
            const productNumber = String(product.id).padStart(2, '0');
            
            container.innerHTML = `
                <div class="product-image-large">
                    <img src="${product.image}" alt="${product.name}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <span class="product-image-placeholder" style="display: none;">👕</span>
                </div>
                <div class="product-details">
                    <span class="product-number-large">#${productNumber}</span>
                    <h1 class="product-title">${product.name}</h1>
                    <div class="product-price-large">${product.price} LYD</div>
                    
                    <!-- 📋 زر نسخ الرابط -->
                    <button class="copy-link-btn" onclick="copyProductLink()">
                        📋 نسخ رابط المنتج
                    </button>
                    
                    <div class="size-section">
                        <div class="size-title">Select Size:</div>
                        <div class="size-options">
                            ${sizes.map(size => `
                                <button class="size-btn ${size === selectedSize ? 'selected' : ''}" 
                                        onclick="selectSize('${size}')">
                                    ${size}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="qty-section">
                        <div class="size-title">Quantity:</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(-1)">−</button>
                            <span class="qty-display">${selectedQty}</span>
                            <button class="qty-btn" onclick="changeQty(1)">+</button>
                        </div>
                    </div>
                    
                    <!-- 🛒 زرين: أضف للسلة / اطلب مباشرة -->
                    <div class="action-buttons">
                        <button class="add-to-cart-btn" onclick="addToCart()">
                            🛒 أضف للسلة
                        </button>
                        <button class="order-now-btn" onclick="orderNow()">
                            ⚡ اطلب مباشرة
                        </button>
                    </div>
                </div>
            `;
        }

        function selectSize(size) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent.trim() === size) {
                    btn.classList.add('selected');
                }
            });
        }

        function changeQty(delta) {
            if (selectedQty + delta >= 1 && selectedQty + delta <= 10) {
                selectedQty += delta;
                document.querySelector('.qty-display').textContent = selectedQty;
            }
        }

        // 📋 نسخ رابط المنتج
        function copyProductLink() {
            const url = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    showNotification('✓ تم نسخ رابط المنتج!');
                });
            } else {
                // طريقة بديلة
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showNotification('✓ تم نسخ رابط المنتج!');
            }
        }

        // 🛒 إضافة للسلة
        function addToCart() {
            let cart = JSON.parse(localStorage.getItem('capo_cart')) || [];
            const existing = cart.find(item => item.id === product.id && item.size === selectedSize);
            
            if (existing) {
                existing.qty += selectedQty;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    qty: selectedQty,
                    size: selectedSize,
                    image: product.image
                });
            }
            
            localStorage.setItem('capo_cart', JSON.stringify(cart));
            updateCartBadge();
            showNotification('✓ تمت الإضافة للسلة!');
        }

        // ⚡ طلب مباشر
        function orderNow() {
            const total = product.price * selectedQty;
            const message = `🛍️ *طلب مباشر - CAPO BRAND*\n\n` +
                          `📦 *المنتج:* ${product.name}\n` +
                          `📏 *المقاس:* ${selectedSize}\n` +
                          `🔢 *الكمية:* ${selectedQty}\n` +
                          `💰 *السعر:* ${total} LYD`;
            
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // إشعار
        function showNotification(message) {
            const existing = document.querySelector('.cart-notification');
            if (existing) existing.remove();
            
            const notif = document.createElement('div');
            notif.className = 'cart-notification';
            notif.textContent = message;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.remove();
            }, 2000);
        }

        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('mobileMenu').classList.toggle('active');
        });

        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', function() {
                document.getElementById('mobileMenu').classList.remove('active');
            });
        });

        updateCartBadge();
        displayProduct();
    </script>
</body>
</html>
